name: Internal tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dp5q_native:
        description: "Run Linux/Windows native checks within the included allowance"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.1"
          python-version: "3.13"
      - name: Install locked development tools
        run: uv sync --locked --python 3.13 --only-dev
      - name: Check all Python code with Ruff
        run: uv run --no-sync ruff check --output-format=github .

  native-packaging:
    if: github.event_name == 'workflow_dispatch' && inputs.dp5q_native
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      LO_RELATIVE: deb/x86_64/LibreOffice_26.8.1_Linux_x86-64_deb.tar.gz
      LO_SHA256: 30903df3b9f61360d9660cd707de48cd2831469114492a5008ed58a0ac77d044
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and native Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python }}
      - name: Install locked headless dependencies
        run: uv sync --locked --python "${{ matrix.python }}"
      - name: Install native Linux converter and Qt system libraries
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.13'
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libopengl0 libxinerama1 libfontconfig1 libcups2t64 fonts-liberation
      - name: Cache pinned converter download
        if: matrix.python == '3.13' && runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/libreoffice-download
          key: libreoffice-26.8.1-${{ runner.os }}-${{ runner.arch }}-${{ env.LO_SHA256 }}
      - name: Verify and unpack pinned native converter
        if: matrix.python == '3.13' && runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          test "$RUNNER_OS/$RUNNER_ARCH" = Linux/X64
          archive="$RUNNER_TEMP/libreoffice-download/${LO_RELATIVE##*/}"
          mkdir -p "${archive%/*}" "$RUNNER_TEMP/libreoffice-native"
          if [[ ! -f "$archive" ]]; then
            curl --fail --location --proto '=https' --proto-redir '=https' --retry 2 --max-time 180 \
              "https://download.documentfoundation.org/libreoffice/stable/26.8.1/$LO_RELATIVE" -o "$archive.partial"
            mv "$archive.partial" "$archive"
          fi
          printf '%s  %s\n' "$LO_SHA256" "$archive" | shasum -a 256 --check
          tar -xzf "$archive" -C "$RUNNER_TEMP/libreoffice-native"
          for package in "$RUNNER_TEMP"/libreoffice-native/*/DEBS/*.deb; do
            dpkg-deb --extract "$package" "$RUNNER_TEMP/libreoffice-install"
          done
          executable="$RUNNER_TEMP/libreoffice-install/opt/libreoffice26.8/program/soffice"
          test -x "$executable"
          version="$("$executable" --version)"
          printf '%s\n' "$version" | tee "$RUNNER_TEMP/libreoffice-version.txt"
          case "$version" in
            "LibreOffice 26.8.1."*|"LibreOffice 26.8.1 "*) ;;
            *) exit 1 ;;
          esac
          echo "CHECKSI_LO=$executable" >> "$GITHUB_ENV"
      - name: Run internal tests
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Prepare bounded public native wheelhouse
        run: >-
          uv run --locked python scripts/dp5q_packaging_check.py prepare
          --wheelhouse "$RUNNER_TEMP/dp5q-wheelhouse" --max-mib 600
      - name: Build and verify a clean installed wheel offline
        env:
          UV_OFFLINE: "1"
        run: |
          wheel_path="$(uv run --locked python scripts/dp5q_packaging_check.py build --out-dir "$RUNNER_TEMP/dp5q-dist")"
          uv run --locked python scripts/dp5q_packaging_check.py verify \
            --wheel "$wheel_path" --wheelhouse "$RUNNER_TEMP/dp5q-wheelhouse" \
            --receipt "$RUNNER_TEMP/dp5q-native-receipt.json"
          cat "$RUNNER_TEMP/dp5q-native-receipt.json"
      - name: Build clean wheel and sdist and verify installed CLI artifacts
        env:
          UV_OFFLINE: "1"
        run: |
          uv run --locked python scripts/portability_check.py build \
            --out-dir "$RUNNER_TEMP/portable-dist" --receipt "$RUNNER_TEMP/portable-build.json"
          wheels=("$RUNNER_TEMP"/portable-dist/*.whl)
          sources=("$RUNNER_TEMP"/portable-dist/*.tar.gz)
          converter_args=()
          if [[ "${{ matrix.python }}" == "3.13" && "$RUNNER_OS" == "Linux" ]]; then
            : "${CHECKSI_LO:?Required native converter was not provisioned}"
            test -x "$CHECKSI_LO"
            converter_args=(--require-libreoffice --libreoffice "$CHECKSI_LO")
          fi
          uv run --locked python scripts/portability_check.py verify \
            --wheel "${wheels[0]}" --sdist "${sources[0]}" \
            --wheelhouse "$RUNNER_TEMP/dp5q-wheelhouse" \
            "${converter_args[@]}" --receipt "$RUNNER_TEMP/portability-base.json"
          uv run --locked python scripts/portability_check.py verify --from-sdist \
            --wheel "${wheels[0]}" --sdist "${sources[0]}" \
            --wheelhouse "$RUNNER_TEMP/dp5q-wheelhouse" \
            "${converter_args[@]}" --receipt "$RUNNER_TEMP/portability-sdist.json"
      - name: Install locked optional GUI and run native GUI lifecycle tests
        if: matrix.python == '3.13'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv sync --locked --python "${{ matrix.python }}" --extra gui
          uv run --locked python -m unittest discover -s gui_tests -v
      - name: Prepare bounded GUI wheelhouse
        if: matrix.python == '3.13'
        run: >-
          uv run --locked python scripts/portability_check.py prepare-gui
          --wheelhouse "$RUNNER_TEMP/gui-wheelhouse"
      - name: Verify clean installed GUI and bundled resources offline
        if: matrix.python == '3.13'
        env:
          UV_OFFLINE: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          wheels=("$RUNNER_TEMP"/portable-dist/*.whl)
          sources=("$RUNNER_TEMP"/portable-dist/*.tar.gz)
          uv run --locked python scripts/portability_check.py verify --gui \
            --wheel "${wheels[0]}" --sdist "${sources[0]}" \
            --wheelhouse "$RUNNER_TEMP/gui-wheelhouse" --receipt "$RUNNER_TEMP/portability-gui.json"
      - name: Retain native verification evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portability-${{ matrix.os }}-${{ matrix.python }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/dp5q-native-receipt.json
            ${{ runner.temp }}/portable-build.json
            ${{ runner.temp }}/portable-dist/constraints.txt
            ${{ runner.temp }}/portability-*.json
            ${{ runner.temp }}/portability-gui.png
            ${{ runner.temp }}/libreoffice-version.txt

  native-semantic-parity:
    if: github.event_name == 'workflow_dispatch' && inputs.dp5q_native
    needs: native-packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.1"
          python-version: "3.13"
      - name: Fetch native receipts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: portability-*
          path: ${{ runner.temp }}/native-receipts
      - name: Compare unchanged analytical values across native targets
        run: >-
          uv run --no-project --python 3.13 python scripts/portability_check.py compare
          --receipts "$RUNNER_TEMP/native-receipts" --receipt "$RUNNER_TEMP/native-parity.json"
      - name: Retain semantic comparison
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-semantic-parity
          retention-days: 7
          path: ${{ runner.temp }}/native-parity.json

  internal-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.1"
          python-version: "3.13"
      - name: Install locked project dependencies
        run: uv sync --locked
      - name: Run internal tests
        run: uv run --locked python -m unittest discover -s tests -v

  gui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libopengl0
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.1"
          python-version: "3.13"
      - name: Install locked GUI dependencies
        run: uv sync --locked --python 3.13 --extra gui
      - name: Run focused GUI lifecycle tests
        timeout-minutes: 5
        run: >-
          uv run --locked python -c
          "import faulthandler, runpy; faulthandler.dump_traceback_later(240);
          runpy.run_module('unittest', run_name='__main__')"
          discover -s gui_tests -v
